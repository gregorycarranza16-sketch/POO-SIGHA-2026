<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block titulo %}Gestión de Horarios{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6fa; margin:0; color:#222; }
    header { background:#2f4a8a; color:#fff; padding:12px 24px; display:flex; justify-content:space-between; }
    header a { color:#fff; }
    main { max-width:900px; margin:24px auto; background:#fff; padding:24px; border-radius:8px; }
    table { width:100%; border-collapse:collapse; margin:12px 0; }
    th, td { border-bottom:1px solid #ddd; padding:8px; text-align:left; }
    th { background:#eef1f8; }
    input, select, button { padding:6px; margin:3px 0; }
    button { background:#2f4a8a; color:#fff; border:0; border-radius:4px; cursor:pointer; }
    .aviso { background:#fff3cd; padding:8px 12px; border-radius:4px; margin-bottom:12px; }
  </style>
</head>
<body>
  <header>
    <strong>Gestión de Horarios</strong>
    {% if usuario %}<span>{{ usuario.nombre_completo }} ({{ usuario.rol }}) · <a href="{{ url_for('logout') }}">Salir</a></span>{% endif %}
  </header>
  <main>
    {% for mensaje in get_flashed_messages() %}<div class="aviso">{{ mensaje }}</div>{% endfor %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
